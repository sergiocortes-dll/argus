[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
render = { path = "crates/render" }
winit = "0.30"
wgpu = "30"
pollster = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
glyphon = "0.12"
portable-pty = "0.9"
terminal-infra = { path = "crates/terminal-infra" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
